name: FinTrack CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run unit and component tests
        run: npm test

      - name: Verify dashboard component tests are discovered
        run: npx vitest list src/App.test.tsx --config vitest.config.ts

      - name: Build production app
        run: npm run build